# Cluster API managed cluster manifests for Cluster 09: default values

cluster:
  name: "cluster09"
  kubernetes_version: v1.34.2
  talos_version: v1.11
  image: factory.talos.dev/nocloud-installer/6adc7e7fba27948460e2231e5272e88b85159da3f3db980551976bf9898ff64b:v1.11.5
  # Public-facing hostnames — served via Cloudflare proxy/tunnel.
  # Gateway listeners on port 80 HTTP; Cloudflare terminates TLS.
  # Requires a Cloudflare DNS proxied A/CNAME record per hostname.
  hostname: []
  # Internal-only hostnames — not exposed publicly, no Cloudflare A records.
  # Gateway listeners on port 443 HTTPS; TLS via lets-encrypt-dns01 ClusterIssuer.
  # Wildcard cert covers *.internal.podzone.net (DNS-01, no hostname enumeration).
  # DNS resolution via pfSense Unbound Host Overrides (internal clients only).
  internalhost: []

# Capability flags — set at provision time; CNI is Tier 3 immutable, storage is Tier 2.
# cni: "" (default kube-proxy) | "cilium" (sets network.cni.name:none + proxy.disabled:true)
cni: ""
# storage: "" (no in-cluster storage) | "in-cluster" (adds drbd kernel modules)
storage: ""

machine:
  # Install disk — /dev/vda for Proxmox virtio VMs, /dev/sda for physical/SATA
  installDisk: /dev/vda

network:
  ip_ranges: [192.168.4.191-192.168.4.197]
  ip_prefix: 24
  gateway: 192.168.4.1
  dns_servers: [8.8.8.8, 8.8.4.4]
  # Sites with internal DNS can override at cluster level, e.g.:
  # dns_servers: [192.168.1.201, 8.8.8.8]
  # Additional SANs for the API server TLS certificate.
  # Add IP addresses and hostnames for any external access endpoint (VPN gateway, jump host, etc.).
  # Long-term: direct VPN access to the cluster network removes the need for these.
  certSANs:
    - "192.168.1.80"
    - freyr

controlplane:
  endpoint_ip: "192.168.4.190"
  machine_count: 1
  machine_template_suffix: controlplane
  boot_volume_size: 40
  num_cores: 4
  num_sockets: 4
  memory_mib: 16384
  # Manifests fetched and applied by the Talos external cloud provider at boot.
  # The CCM manifest is required for cloud-provider: external kubelet flag to function.
  cloudProviderManifests:
    - https://raw.githubusercontent.com/siderolabs/talos-cloud-controller-manager/main/docs/deploy/cloud-controller-manager.yml

worker:
  machine_count: 1
  machine_template_suffix: worker
  boot_volume_size: 140
  num_cores: 4
  num_sockets: 4
  memory_mib: 16384

proxmox:
  allowed_nodes: [venus]
  template:
    sourcenode: venus
    template_vmid: 100
  vm:
    boot_volume_device: virtio0
    bridge: vmbr0

registries:
  # Registry mirrors — disabled by default. Enable and configure per cluster when a
  # pull-through proxy is available. When enabled, Talos routes image pulls through
  # the configured mirrors. Set via gitopsapi ClusterSpec (immutable — Tier 2).
  #
  # Example (replace artefacts.your.domain with your proxy hostname):
  # enabled: true
  # mirrors:
  #   docker.io:
  #     endpoints:
  #       - http://artefacts.your.domain/repository/proxy-dockerhub
  #     overridePath: true
  #   ghcr.io:
  #     endpoints:
  #       - http://artefacts.your.domain/repository/proxy-ghcr
  #     overridePath: true
  #   gcr.io:
  #     endpoints:
  #       - http://artefacts.your.domain/repository/proxy-gcr
  #     overridePath: true
  #   registry.k8s.io:
  #     endpoints:
  #       - http://artefacts.your.domain/repository/proxy-k8s
  #     overridePath: true
  #   quay.io:
  #     endpoints:
  #       - http://artefacts.your.domain/repository/proxy-quay
  #     overridePath: true
  enabled: false
  mirrors: {}
