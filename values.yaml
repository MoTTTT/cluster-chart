# Cluster API managed cluster manifests for Cluster 09: default values

cluster:
  name: "cluster09"
  kubernetes_version: v1.34.2
  talos_version: v1.11.5
  image: factory.talos.dev/nocloud-installer/6adc7e7fba27948460e2231e5272e88b85159da3f3db980551976bf9898ff64b
  # Public-facing hostnames — served via Cloudflare proxy/tunnel.
  # Gateway listeners on port 80 HTTP; Cloudflare terminates TLS.
  # Requires a Cloudflare DNS proxied A/CNAME record per hostname.
  hostname: []
  # Internal-only hostnames — not exposed publicly, no Cloudflare A records.
  # Gateway listeners on port 443 HTTPS; TLS via lets-encrypt-dns01 ClusterIssuer.
  # Wildcard cert covers *.internal.podzone.net (DNS-01, no hostname enumeration).
  # DNS resolution via pfSense Unbound Host Overrides (internal clients only).
  internalhost: []

network:
  ip_ranges: [192.168.4.191-192.168.4.197]
  ip_prefix: 24
  gateway: 192.168.4.1
  bastion_host: freyr
  bastion_host_endpoint_ip: "192.168.1.80"
  dns_servers: [8.8.8.8, 8.8.4.4]
  # Sites with internal DNS can override at cluster level, e.g.:
  # dns_servers: [192.168.1.201, 8.8.8.8]
controlplane:
  endpoint_ip: "192.168.4.190"
  machine_count: 1
  machine_template_suffix: controlplane
  boot_volume_size: 40
  num_cores: 4
  num_sockets: 4
  memory_mib: 16384
  extra_manifests:
    - http://192.168.4.1/cilium.yaml
    - http://192.168.4.1/flux.yaml
    - http://192.168.4.1/flux-instance-cluster09.yaml
    - http://192.168.4.1/flux-secret.yaml
    - http://192.168.4.1/gateway-api.yaml

worker:
  machine_count: 1
  machine_template_suffix: worker
  boot_volume_size: 140
  num_cores: 4
  num_sockets: 4
  memory_mib: 16384

proxmox:
  allowed_nodes: [venus]
  template:
    sourcenode: venus
    template_vmid: 100
  vm:
    boot_volume_device: virtio0
    bridge: vmbr0

registries:
  # Nexus pull-through proxy at artefacts.podzone.cloud replaces Harbor (192.168.4.100)
  # Proxy repos configured 2026-03-26 via Nexus REST API (all HTTP 201).
  # Access is path-based via port 8081 — same overridePath: true pattern as Harbor.
  # artefacts.podzone.cloud must resolve to the Nexus service external IP/hostname;
  # HTTPRoute + DNS setup is a pending manual step (see docs/nexus-image-cache-migration.md).
  mirrors:
    docker.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-dockerhub
      overridePath: true
    ghcr.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-ghcr
      overridePath: true
    gcr.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-gcr
      overridePath: true
    registry.k8s.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-k8s
      overridePath: true
    quay.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-quay
      overridePath: true
    cr.fluentbit.io:
      endpoints:
        - http://artefacts.podzone.cloud/repository/proxy-fluentbit
      overridePath: true